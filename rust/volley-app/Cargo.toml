[package]
name = "volley-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "Volleyball Studio Rust-native application (full rewrite in progress)"

[dependencies]
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
