[package]
name = "volley-inference"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native ONNX Runtime inference for VballNet, RTMDet and RTMPose"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
sha2 = "0.10"
