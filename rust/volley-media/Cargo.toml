[package]
name = "volley-media"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust-native video metadata, compatibility and FFmpeg orchestration for Volleyball Studio"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
