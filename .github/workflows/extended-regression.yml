name: Extended regression suite

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-python:
    name: Weekly / all Python tests + FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Full Python regression suite
        env:
          PYTHONPATH: '.:src'
        run: |
          mkdir -p test-results
          uv run --no-sync pytest -q tests \
            --junitxml=test-results/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-regressions
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  full-browser:
    name: Weekly / UI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.cjs

  docker:
    name: Weekly / Docker boot and health
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t volley-studio:weekly .
      - name: Validate container start
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name volley-weekly -p 127.0.0.1:8765:8765 volley-studio:weekly
          trap 'docker logs volley-weekly || true; docker rm -f volley-weekly || true' EXIT
          for i in {1..60}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8765/api/health \
              | python -c 'import json,sys; assert json.load(sys.stdin)["ok"]' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
